## Render Blueprint for CARVMS (Billing Data Validation).
##
## Two free web services (FastAPI backend, static-built React frontend)
## plus a free managed Postgres database -- real persistent storage, not
## the SQLite-on-ephemeral-disk setup this started on. Data now survives
## redeploys/restarts. See docs/DEPLOYMENT.md for the full step-by-step
## (creating the Render account, connecting this repo, filling in the
## placeholder URLs below after the first deploy).
##
## Render's free Postgres plan expires after 30 days and must be upgraded
## (~$7/month) or replaced to keep the data past that point -- see
## docs/DEPLOYMENT.md.
##
## To use: on render.com, "New +" -> "Blueprint" -> connect this repo/branch
## -> Render reads this file and proposes the database + both services below.

databases:
  - name: carvms-db
    plan: free
    databaseName: carvms
    user: carvms

services:
  - type: web
    name: carvms-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    # alembic upgrade head runs the schema migrations against the real
    # Postgres database below (verified against the full migration chain
    # offline before this was wired up -- see docs/DEPLOYMENT.md) before
    # uvicorn starts.
    startCommand: "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7

      # Auto-generated by Render at first deploy -- never set this
      # yourself, never share it.
      - key: SECRET_KEY
        generateValue: true

      # Real persistent Postgres -- Render fills this in automatically
      # from the carvms-db database defined above, no manual copy-paste.
      - key: DATABASE_URL
        fromDatabase:
          name: carvms-db
          property: connectionString

      # These are this deploy's REAL URLs (already live) -- not
      # placeholders. Deliberately plain `value:` (not sync: false) so a
      # Blueprint sync keeps them consistent automatically. If you ever
      # fork this to a different Render account, service names that
      # collide with someone else's get a random suffix appended to the
      # URL -- check each service's actual dashboard page and update
      # these (and VITE_API_BASE_URL below) to match before relying on
      # login working. Comma-separated if you ever need more than one
      # CORS origin.
      - key: CORS_ORIGINS
        value: "https://carvms-frontend.onrender.com"
      - key: FRONTEND_URL
        value: "https://carvms-frontend.onrender.com"

      - key: UPLOAD_DIR
        value: "uploads"
      - key: MAX_UPLOAD_SIZE_MB
        value: "25"

      # One-time bootstrap Admin -- fill these in for the FIRST deploy only
      # (see user_service.ensure_bootstrap_admin); safe to leave set
      # afterwards, it's a no-op once any Admin account exists. Render will
      # prompt for these when you create the Blueprint since they have no
      # default and aren't auto-generated.
      - key: BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false

      # Optional integrations -- leave blank in the Render dashboard until
      # you actually set these up (Gmail OAuth, Centers Master Google
      # Sheet). The app runs fully without them.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: EMAIL_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: CENTERS_MASTER_SHEET_CSV_URL
        sync: false

  - type: web
    name: carvms-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "dist"
    envVars:
      - key: NODE_VERSION
        value: "20"

      # This deploy's REAL backend URL (already live) -- see the identical
      # comment on CORS_ORIGINS above for why this is a plain value and
      # what to check if you ever fork this to a different Render account.
      - key: VITE_API_BASE_URL
        value: "https://carvms-backend.onrender.com"

    # Client-side routing (React Router) -- every path must fall back to
    # index.html so refreshing on e.g. /delayed-cash doesn't 404.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
