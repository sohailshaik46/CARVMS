## Render Blueprint for CARVMS (Billing Data Validation).
##
## Two free services: the FastAPI backend and the static-built React
## frontend. See docs/DEPLOYMENT.md for the full step-by-step (creating the
## Render account, connecting this repo, filling in the placeholder URLs
## below after the first deploy, and the accepted risk of SQLite on an
## ephemeral disk -- data can be lost on redeploy/restart on the free tier).
##
## To use: on render.com, "New +" -> "Blueprint" -> connect this repo/branch
## -> Render reads this file and proposes both services below.

services:
  - type: web
    name: carvms-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    # alembic upgrade head runs the schema migrations against whatever
    # DATABASE_URL points at (fresh SQLite file each deploy on the free
    # plan -- see docs/DEPLOYMENT.md) before uvicorn starts.
    startCommand: "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7

      # Auto-generated by Render at first deploy -- never set this
      # yourself, never share it.
      - key: SECRET_KEY
        generateValue: true

      # SQLite on the free plan's ephemeral disk -- accepted risk for a
      # first deploy (see docs/DEPLOYMENT.md). Point this at a real
      # managed Postgres URL later to stop losing data on redeploy/restart.
      - key: DATABASE_URL
        value: "sqlite:///./carvms.db"

      # PLACEHOLDER -- after your first deploy, replace with your actual
      # frontend URL (e.g. https://carvms-frontend.onrender.com, no
      # trailing slash), then manually redeploy this service. Comma-
      # separated if you ever need more than one origin.
      - key: CORS_ORIGINS
        value: "http://localhost:5173"
      - key: FRONTEND_URL
        value: "http://localhost:5173"

      - key: UPLOAD_DIR
        value: "uploads"
      - key: MAX_UPLOAD_SIZE_MB
        value: "25"

      # One-time bootstrap Admin -- fill these in for the FIRST deploy only
      # (see user_service.ensure_bootstrap_admin); safe to leave set
      # afterwards, it's a no-op once any Admin account exists. Render will
      # prompt for these when you create the Blueprint since they have no
      # default and aren't auto-generated.
      - key: BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false

      # Optional integrations -- leave blank in the Render dashboard until
      # you actually set these up (Gmail OAuth, Centers Master Google
      # Sheet). The app runs fully without them.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: EMAIL_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: CENTERS_MASTER_SHEET_CSV_URL
        sync: false

  - type: web
    name: carvms-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "dist"
    envVars:
      - key: NODE_VERSION
        value: "20"

      # PLACEHOLDER -- after your first deploy, replace with your actual
      # backend URL (e.g. https://carvms-backend.onrender.com, no trailing
      # slash), then manually redeploy this service.
      - key: VITE_API_BASE_URL
        value: "http://localhost:8000"

    # Client-side routing (React Router) -- every path must fall back to
    # index.html so refreshing on e.g. /delayed-cash doesn't 404.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
